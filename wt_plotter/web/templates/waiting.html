{% extends "base.html" %}
{% block title %}{{ t('waiting.title') }} · {% endblock %}
{% block content %}
<div class="waiting" id="waiting-for-match">
    <div class="spinner"></div>
    <h2>{{ t('waiting.title') }}</h2>
    <p>{{ t('waiting.hint') }}</p>
    <p class="capture-stopped" id="capture-stopped" hidden>{{ t('viewer.capture_stopped') }}</p>
    <a href="{{ url_for('index') }}" class="btn btn-secondary">{{ t('waiting.recorded_matches') }}</a>
</div>
{% endblock %}
