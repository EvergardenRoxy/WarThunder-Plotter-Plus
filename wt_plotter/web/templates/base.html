<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %}{{ t('nav.app_name') }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body class="{{ body_class | default('') }}">
    <header class="header">
        <h1>{{ t('nav.app_name') }}</h1>
        <nav>
            <a href="{{ url_for('index') }}"{% if request.endpoint in ('index', 'match_view') %} aria-current="page"{% endif %}>{{ t('nav.matches') }}</a>
            <a href="{{ url_for('live_view') }}"{% if request.endpoint == 'live_view' %} aria-current="page"{% endif %}>{{ t('nav.live') }}</a>
            <select id="language-select" class="language-select" aria-label="{{ t('nav.language') }}">
                {% for code, name in languages.items() %}
                <option value="{{ code }}"{% if lang == code %} selected{% endif %}>{{ name }}</option>
                {% endfor %}
            </select>
            <button id="quit-app" class="btn btn-danger" title="{{ t('nav.quit_title') }}">{{ t('nav.quit') }}</button>
        </nav>
    </header>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    <script>window.I18N = {{ catalog | tojson }};</script>
    <script src="{{ url_for('static', filename='i18n.js') }}"></script>
    {% block scripts %}{% endblock %}
    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
